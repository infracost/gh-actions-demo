on:
  pull_request:
    types: [opened, synchronize, closed, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Checkout steps are skipped on closed PRs since diffing is not needed —
      # the diff action below detects the closed event and updates the PR's
      # status in the Infracost dashboard (MERGED or CLOSED) without scanning.
      - uses: actions/checkout@v4
        if: github.event.action != 'closed'
        with:
          path: head

      - uses: actions/checkout@v4
        if: github.event.action != 'closed'
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - uses: infracost/actions/diff@479740a48b8abd3fe10784e37b71cd1bd02b2263
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          base-path: base
          head-path: head

  scan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: infracost/actions/scan@479740a48b8abd3fe10784e37b71cd1bd02b2263
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          path: .
